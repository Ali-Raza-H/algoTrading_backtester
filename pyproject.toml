[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-backtester"
version = "0.1.0"
description = "Deterministic historical market simulation and backtesting platform"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "Proprietary" }
dependencies = [
  "pyarrow>=18",
  "pyyaml>=6.0.2",
]

[project.scripts]
backtest = "backtest.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.120",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "types-pyyaml>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/backtest", "strategies"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["backtest"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

